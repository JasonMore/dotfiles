##### Session defaults #######################################################
if-shell 'test -x /bin/zsh' 'set-option -g default-shell /bin/zsh'
set -g history-limit 100000
set -g escape-time 0

##### Interaction ############################################################
set -g mouse on

##### Terminal capabilities ##################################################
# Keep both defaults for compatibility; the later tmux-256color overrides when supported.
set -g default-terminal "screen-256color"
set-option -g default-terminal 'tmux-256color'
set-option -sa terminal-features ',xterm*:RGB'
set-option -sa terminal-features ',xterm*:Tc'
set -g allow-passthrough on

##### Clipboard integration ##################################################
set -s set-clipboard on

# Copy selection to the system clipboard when a clipboard tool is available.
if-shell '[ "$(uname -s)" = Darwin ]' {
    bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel pbcopy
    bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel pbcopy
} {
    if-shell 'command -v xclip >/dev/null 2>&1' {
        bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -i"
        bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -i"
    }
}

##### Key bindings ###########################################################
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"
